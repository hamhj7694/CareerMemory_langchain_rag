name: Validate, build and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: career-memory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: same-origin
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Deployment control and failure tests (no AWS credentials)
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          python -m unittest discover -s scripts/tests -v
      - run: pip install -r requirements.txt httpx
      - run: python -m unittest discover -s AI_Engine/tests
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:////tmp/career-memory-ci.db
          ATTACHMENT_STORAGE_ROOT: /tmp/career-memory-ci-uploads
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
        env:
          PYTHON: python
  containers:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp deploy/.env.deploy.example .env.deploy
          # Local smoke uses HTTP; secure cookies are checked separately in unit tests.
          sed -i 's/APP_ENV=production/APP_ENV=development/' .env.deploy
          docker compose --env-file .env.deploy -f compose.yaml -f compose.production.yaml config --quiet
          docker run --rm -e SITE_DOMAIN=example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          IMAGE_TAG="$GITHUB_SHA" docker compose build
          IMAGE_TAG="$GITHUB_SHA" docker compose up -d --wait --wait-timeout 180
          python scripts/smoke-deployment.py create
          IMAGE_TAG="$GITHUB_SHA" docker compose down
          IMAGE_TAG="$GITHUB_SHA" docker compose up -d --wait --wait-timeout 180
          python scripts/smoke-deployment.py verify
      - if: always()
        run: docker compose logs --no-color --tail=100
      - name: Export tested images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        run: docker save "career-memory-api:$GITHUB_SHA" "career-memory-web:$GITHUB_SHA" | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        with:
          name: tested-images
          path: images.tar.gz
          compression-level: 0
          retention-days: 1
  deploy:
    needs: containers
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
      WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SSM_DOCUMENT_NAME: ${{ vars.SSM_DOCUMENT_NAME }}
      SSM_DOCUMENT_VERSION: ${{ vars.SSM_DOCUMENT_VERSION }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment settings
        run: python scripts/deploy-ssm.py --validate-only
      - uses: actions/download-artifact@v4
        with:
          name: tested-images
      - name: Get short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: career-memory-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Publish tested images to ECR
        run: bash deploy/publish-release.sh
      - name: Deploy through restricted SSM document and wait for result
        run: python scripts/deploy-ssm.py
