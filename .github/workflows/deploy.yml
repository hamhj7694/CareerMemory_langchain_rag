name: Validate, build and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: career-memory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: same-origin
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt httpx
      - run: python -m unittest discover -s AI_Engine/tests
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:////tmp/career-memory-ci.db
          ATTACHMENT_STORAGE_ROOT: /tmp/career-memory-ci-uploads
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
        env:
          PYTHON: python
  containers:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp deploy/.env.deploy.example .env.deploy
          # Local smoke uses HTTP; secure cookies are checked separately in unit tests.
          sed -i 's/APP_ENV=production/APP_ENV=development/' .env.deploy
          docker compose --env-file .env.deploy -f compose.yaml -f compose.production.yaml config --quiet
          docker run --rm -e SITE_DOMAIN=example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          IMAGE_TAG="$GITHUB_SHA" docker compose build
          IMAGE_TAG="$GITHUB_SHA" docker compose up -d --wait --wait-timeout 180
          python scripts/smoke-deployment.py create
          IMAGE_TAG="$GITHUB_SHA" docker compose down
          IMAGE_TAG="$GITHUB_SHA" docker compose up -d --wait --wait-timeout 180
          python scripts/smoke-deployment.py verify
      - if: always()
        run: docker compose logs --no-color --tail=100
      - if: github.event_name != 'pull_request'
        run: |
          docker save "career-memory-api:$GITHUB_SHA" "career-memory-web:$GITHUB_SHA" | gzip > images.tar.gz
          tar -czf deployment.tar.gz images.tar.gz compose.yaml compose.production.yaml deploy
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: deployment
          path: deployment.tar.gz
          retention-days: 7
  deploy:
    needs: containers
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deployment
      - name: Transfer and activate tested release
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
          DEPLOY_KEY: ${{ secrets.EC2_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/career-memory/incoming'
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes deployment.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/career-memory/incoming/$GITHUB_SHA.tar.gz"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$GITHUB_SHA" < deploy/activate-release.sh
