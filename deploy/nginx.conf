map $request_method $mutation_key {
    default $binary_remote_addr;
    GET "";
    HEAD "";
    OPTIONS "";
}
limit_req_zone $mutation_key zone=mutations:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=connections:10m;
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 26m;
    limit_req_status 429;
    limit_conn connections 10;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Only the TLS gateway can supply a client address. No trust in public XFF.
    set_real_ip_from 172.30.88.2;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    location /api/ {
        limit_req zone=mutations burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 240s;
        proxy_buffering off;
    }
    location = /health {
        proxy_pass http://api:8000/health;
    }
    location = /capabilities {
        proxy_pass http://api:8000/capabilities;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
